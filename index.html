<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="UTF-8">
<title>RealDejv | Video Editor</title>

<style>
body {
    margin:0;
    font-family: Arial;
    background:#0a0a0a;
    color:white;
}

/* NAV */
nav {
    position:fixed;
    top:0;
    width:100%;
    display:flex;
    justify-content:center;
    gap:40px;
    padding:20px;
    background:rgba(0,0,0,0.6);
    backdrop-filter: blur(10px);
    z-index:1000;
}

nav a {
    color:white;
    text-decoration:none;
    opacity:0.7;
    transition:0.3s;
}

nav a:hover {
    opacity:1;
    color:#8a2be2;
}

/* HERO */
header {
    height:100vh;
    display:flex;
    flex-direction:column;
    justify-content:center;
    align-items:center;
}

h1 {
    font-size:70px;
    color:#8a2be2;
    text-shadow:0 0 20px #8a2be2;
}

/* NAPIŠ MI BOX */
.contact-box {
    margin-top:30px;
    background:#111;
    padding:25px;
    border-radius:15px;
    box-shadow:0 0 20px rgba(138,43,226,0.2);
    animation: fadeIn 1.5s ease;
}

input, textarea {
    width:100%;
    padding:12px;
    margin-top:10px;
    background:#0a0a0a;
    border:1px solid #333;
    color:white;
    border-radius:8px;
}

button {
    margin-top:15px;
    padding:12px;
    width:100%;
    background:#8a2be2;
    border:none;
    color:white;
    border-radius:10px;
    cursor:pointer;
    transition:0.3s;
}

button:hover {
    box-shadow:0 0 20px #8a2be2;
}

/* SECTIONS */
section {
    padding:100px 20px;
    max-width:900px;
    margin:auto;
}

.text {
    color:#ccc;
}

/* SOCIAL */
.socials {
    display:flex;
    justify-content:center;
    gap:30px;
}

.socials img {
    width:60px;
    transition:0.3s;
}

.socials img:hover {
    transform:scale(1.2);
}

/* ANIMACE */
@keyframes fadeIn {
    from {opacity:0; transform:translateY(20px);}
    to {opacity:1; transform:translateY(0);}
}
</style>
</head>

<body>

<nav>
<a href="#home">Domů</a>
<a href="#about">O mně</a>
<a href="#portfolio">Portfolio</a>
<a href="#social">Sociální sítě</a>
<a href="#reviews">Recenze</a>
</nav>

<header id="home">
<h1>RealDejv</h1>
<p>Video editor</p>

<!-- NAPIŠ MI -->
<div class="contact-box">

<form action="https://formspree.io/account" method="POST">

<input type="text" name="name" placeholder="Tvoje jméno" required>
<input type="email" name="email" placeholder="Tvůj email" required>
<textarea name="message" placeholder="Zpráva..." required></textarea>

<button type="submit">Odeslat</button>

</form>

</div>

</header>

<section id="about">
<h2>O mně</h2>
<p class="text">
Editu se věnuju posledních 5 let... (nech jak máš)
</p>
</section>

<section id="portfolio">
<h2>Portfolio</h2>
<p class="text">Sem přidáš videa</p>
</section>

<section id="social">
<h2>Sociální sítě</h2>

<div class="socials">

<a href="https://www.instagram.com/realdave_org" target="_blank">
<img src="https://cdn-icons-png.flaticon.com/512/2111/2111463.png">
</a>

</div>

</section>

<section id="reviews">
<h2>Recenze</h2>
<p class="text">Zatím žádné</p>
</section>

</body>
</html>
